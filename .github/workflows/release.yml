name: Release

# Every push to main (i.e. every merge) bumps the version, tags it, and
# publishes a release with Linux and Windows builds.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (overrides the commit-based guess)
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    # Skip the commit this workflow pushes itself.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Bump version, commit and tag
        id: bump
        env:
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          # Bump level: manual input wins; otherwise look at commits since the
          # last tag. "BREAKING"/"!:" -> major, "feat" -> minor, else patch.
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          RANGE=${LAST_TAG:+$LAST_TAG..HEAD}
          SUBJECTS=$(git log --format=%s $RANGE)
          if [ -n "$INPUT_BUMP" ]; then
            BUMP="$INPUT_BUMP"
          elif echo "$SUBJECTS" | grep -qiE 'BREAKING|^[a-z]+(\(.*\))?!:'; then
            BUMP=major
          elif echo "$SUBJECTS" | grep -qiE '^feat(\(.*\))?:'; then
            BUMP=minor
          else
            BUMP=patch
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/bump-version.sh "$BUMP"
          git push origin HEAD:main --follow-tags
          echo "version=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig1-dev libvulkan-dev libssl-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --bin chelete

      - name: Get version
        id: version
        run: echo "VERSION=${{ needs.version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Create tarball
        run: |
          NAME="chelete_${{ steps.version.outputs.VERSION }}_linux_x86_64"
          mkdir -p "dist/$NAME"
          cp target/release/chelete "dist/$NAME/"
          cp assets/chelete.desktop "dist/$NAME/"
          cp assets/icons/128x128.png "dist/$NAME/chelete.png"
          cp LICENSE README.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"

      - name: Create AppImage
        working-directory: dist
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp ../target/release/chelete AppDir/usr/bin/
          cp ../assets/icons/128x128.png AppDir/chelete.png
          cp ../assets/icons/128x128.png AppDir/usr/share/icons/hicolor/256x256/apps/chelete.png
          cp ../assets/chelete.desktop AppDir/chelete.desktop
          cp ../assets/chelete.desktop AppDir/usr/share/applications/chelete.desktop
          cat > AppDir/AppRun << 'APPEOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/chelete" "$@"
          APPEOF
          chmod +x AppDir/AppRun AppDir/usr/bin/chelete
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

      - name: Package .deb
        working-directory: dist
        run: |
          DEB_DIR="chelete_${{ steps.version.outputs.VERSION }}_amd64"
          mkdir -p "$DEB_DIR/DEBIAN" "$DEB_DIR/usr/bin" "$DEB_DIR/usr/share/applications" "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"
          cp ../target/release/chelete "$DEB_DIR/usr/bin/"
          cp ../assets/chelete.desktop "$DEB_DIR/usr/share/applications/"
          cp ../assets/icons/128x128.png "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/chelete.png"
          cat > "$DEB_DIR/DEBIAN/control" << EOF
          Package: chelete
          Version: ${{ steps.version.outputs.VERSION }}
          Architecture: amd64
          Maintainer: Victor Phos
          Depends: libvulkan1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libfontconfig1
          Description: Personal finance tracker
           A fast, keyboard-driven personal finance tracker built for Omarchy.
          EOF
          dpkg-deb --build "$DEB_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --bin chelete

      - name: Name binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/chelete.exe "dist/chelete_${{ needs.version.outputs.version }}_windows_x86_64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  release:
    needs: [version, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
