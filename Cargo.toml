[package]
name = "chelete"
version = "0.6.3"
edition = "2021"
default-run = "chelete"

[lib]
name = "chelete_lib"
path = "src/lib.rs"

[[bin]]
name = "chelete"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
dirs = "5"
csv = "1.4.0"
gpui-kit = { version = "=0.7.0" }
gpui-omarchy = "0.2.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
gpui-kit = { version = "=0.7.0", features = ["test-support"] }
